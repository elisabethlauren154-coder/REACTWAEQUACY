<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WA React</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#070b1a;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:#11182d;
    border-radius:24px;
    padding:25px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.title{
    color:#ff7a3d;
    font-size:28px;
    font-weight:600;
    margin-bottom:10px;
}

.desc{
    color:#9ca3af;
    font-size:14px;
    margin-bottom:25px;
}

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    color:white;
    margin-bottom:8px;
    font-size:14px;
}

.input-box input{
    width:100%;
    background:#0b1020;
    border:1px solid #2d3748;
    outline:none;
    padding:15px;
    border-radius:14px;
    color:white;
    font-size:15px;
}

.input-box input:focus{
    border-color:#ff7a3d;
}

.note{
    margin-top:8px;
    color:#9ca3af;
    font-size:12px;
}

.submit{
    width:100%;
    margin-top:20px;
    background:linear-gradient(45deg,#ff7a3d,#ffb36b);
    border:none;
    padding:15px;
    border-radius:16px;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

#status{
    margin-top:18px;
    text-align:center;
    color:white;
    font-size:14px;
}

</style>
</head>
<body>

<div class="card">

    <div class="title">
        🚀 Instant React
    </div>

    <div class="desc">
        React postingan WhatsApp dengan emoji favoritmu.
    </div>

    <div class="input-box">
        <label>WhatsApp Post Link</label>

        <input 
        type="text"
        id="link"
        placeholder="https://whatsapp.com/channel/...">
    </div>

    <div class="input-box">
        <label>Emoji React</label>

        <input 
        type="text"
        id="emoji"
        placeholder="😱,😝,❤️,😭">
        
        <div class="note">
            Pisahkan emoji menggunakan koma
        </div>
    </div>

    <button class="submit" onclick="kirimReact()">
        Kirim React
    </button>

    <div id="status"></div>

</div>

<script>

async function kirimReact(){

    const link = document.getElementById('link').value;
    const emoji = document.getElementById('emoji').value;

    if(link === ''){
        alert('Masukkan link WhatsApp');
        return;
    }

    if(emoji === ''){
        alert('Masukkan emoji');
        return;
    }

    document.getElementById('status').innerHTML =
    '⏳ Mengecek API...';

    try{

        // TEST API
        const response = await fetch(
        'https://back.asitha.top/api/user/details?apiKey=dc4c789365f713a0b4f75b7164e4cfc856153605dad75bbaa3074c0d759b7d3d'
        );

        const hasil = await response.json();

        console.log(hasil);

        if(response.ok){

            document.getElementById('status').innerHTML =
            '✅ API tersambung | Coins: ' + hasil.coins;

        }else{

            document.getElementById('status').innerHTML =
            '❌ API gagal';

        }

    }catch(err){

        console.log(err);

        document.getElementById('status').innerHTML =
        '❌ Error koneksi API / CORS';

    }

}

</script>

</body>
</html>
